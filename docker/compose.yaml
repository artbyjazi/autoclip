name: clippy

services:
  clippy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: base
    image: clippy:latest
    ports:
      # Bound to loopback because the deprecated UI API is not Bearer-protected.
      # Keep the service behind an authenticated private proxy such as
      # Tailscale Serve.
      - '127.0.0.1:8000:8000'
    volumes:
      - clippy-data:/data
      # Drop source files here to ingest them without uploading through the UI.
      - ./media:/media:ro
    environment:
      CLIPPY_HOME: /data
    restart: unless-stopped

  # docker compose --profile gpu up
  clippy-gpu:
    profiles: ['gpu']
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gpu
    image: clippy:gpu
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - clippy-data:/data
      - ./media:/media:ro
    environment:
      CLIPPY_HOME: /data
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  clippy-data:
