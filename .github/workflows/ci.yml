name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both supported Python versions on Linux; one on macOS and Windows.
        # The Windows leg is not optional — filtergraph path escaping and
        # keyring behaviour both differ there, and both have already caused bugs.
        include:
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: macos-latest, python: '3.12' }
          - { os: windows-latest, python: '3.12' }

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        # ffmpeg-full, not ffmpeg: Homebrew split the formula, and the plain one
        # is a reduced build with no libass — so it installs cleanly and then
        # cannot burn a single caption. CI caught this against the real runner.
        run: |
          brew install ffmpeg-full
          brew link --force --overwrite ffmpeg-full || true

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full -y --no-progress

      - name: Verify ffmpeg can burn subtitles
        shell: bash
        # Checks for the `ass` filter rather than grepping the version banner for
        # "libass": not every build prints its configure line, and Homebrew's
        # does not. The filter is what the export stage actually calls.
        #
        # The output is captured into a variable rather than piped, because
        # `grep -q` exits on its first match and SIGPIPEs ffmpeg — and GitHub
        # runs these steps with `set -o pipefail`, which turns that into a
        # failed step even when the filter is present.
        run: |
          ffmpeg -hide_banner -version | head -n 1
          filters="$(ffmpeg -hide_banner -filters 2>/dev/null || true)"
          if printf '%s\n' "$filters" | grep -qE '[[:space:]]ass[[:space:]]'; then
            echo "ass filter present"
          else
            echo "::error::This ffmpeg has no 'ass' filter; captions cannot be burned in."
            echo "--- subtitle-related filters this build does have ---"
            printf '%s\n' "$filters" | grep -iE 'subtitle|ass|text' || echo "(none)"
            exit 1
          fi

      - name: Create the environment
        run: uv venv --python ${{ matrix.python }}

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Check that every extra resolves
        # Catches an unsatisfiable extra without paying to download it. The
        # diarization extra shipped broken once because of a numpy upper bound.
        run: |
          uv pip install --dry-run -e ".[diarization]"
          uv pip install --dry-run -e ".[gpu]"

      # `uv run --no-sync` runs each tool from the venv built above without
      # re-resolving the project. Plain `uv run` would sync every optional
      # extra (pulling PyTorch into a lint job), and putting .venv on PATH by
      # hand doesn't survive the shell change on Windows, where bash writes a
      # /d/a/... style path that later PowerShell steps can't use.
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync mypy backend/clippy
        continue-on-error: true

      - name: Unit tests
        run: uv run --no-sync pytest -m "not slow and not golden and not e2e" -q

      - name: Render tests
        # The real ffmpeg render path — the one that catches escaping, font, and
        # encoder problems that unit tests structurally cannot.
        run: uv run --no-sync pytest -m "slow and not golden and not e2e" -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check and build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: base
          push: false
          load: true
          tags: clippy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name clippy -p 8000:8000 clippy:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "\nHealthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container never became healthy."
          docker logs clippy
          exit 1
